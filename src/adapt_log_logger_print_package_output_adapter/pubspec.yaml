name: adapt_log_logger_print_package_output_adapter
description: Output adapter para exibir logs formatados (PrettyPrint) no console via package logger.
version: 1.0.0
repository: https://github.com/ranierjardim/dart_adapt_log

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  adapt_log:
    path: ../adapt_log/
  logger: ^2.4.0

dev_dependencies:
  adapt_log_text_log_input_adapter:
    path: ../adapt_log_text_log_input_adapter/
  lints: ^3.0.0
  test: ^1.24.0
