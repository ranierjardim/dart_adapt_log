name: adapt_log_auto_report_log_input_adapter
description: Input adapter que dispara automaticamente um report completo toda vez que um erro é detectado no fluxo de logs.
version: 1.0.0
repository: https://github.com/ranierjardim/dart_adapt_log

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  adapt_log:
    path: ../adapt_log/
  adapt_log_report_log_input_adapter:
    path: ../adapt_log_report_log_input_adapter/

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
